plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '0.7.3'
}

group 'com.huage2580'
version '3.1.0'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public' }
    jcenter()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.3.2', {
     exclude group:'com.zaxxer'
     exclude group:'org.slf4j'
     exclude group:'com.mchange'
    }
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'com.formdev:flatlaf:3.2.5'
    implementation 'com.google.code.gson:gson:2.8.9'
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version '2021.1.1'
    intellij.updateSinceUntilBuild true
    intellij.sameSinceUntilBuild false
}
patchPluginXml {
    changeNotes """
        v1.1 增加了股票的tab，采用腾讯的行情接口，股票轮询间隔10s  <br>
        v1.2 支持了港股和美股 示例代码：（sh000001,sh600519,sz000001,hk00700,usAAPL）代码一般可以在各网页端看得到  <br>
        v1.3   支持了IDEA 2020.1.3,兼容到`IDEA 2017.3`，修复macOS 行高问题（不确定 <br>
        v1.4 增加了隐蔽模式（全拼音和无色涨跌幅
        v1.5 增加了股票界面的排序~，可按净值和涨跌幅等列排序
        v1.6 样式修改，增加精确净值（当日，上一交易日
        v1.7 设置界面样式调整，增加新浪股票接口备选
      """
    sinceBuild '173.*' //最低版本限制
    untilBuild null //最高版本限制 好像必须指定
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
buildSearchableOptions.enabled = false

sourceSets {
    desktop {
        java.srcDirs = ['src/desktop/java']
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

task desktopJar(type: Jar) {
    archiveBaseName = 'leeks-desktop'
    archiveVersion = project.version
    from sourceSets.desktop.output
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from('src/main/resources') {
        include 'icon.png'
    }
    manifest {
        attributes 'Main-Class': 'app.DesktopApp'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task desktopExe(type: Exec, dependsOn: desktopJar) {
    def jpackage = "${System.getProperty('java.home')}/bin/jpackage.exe"
    def outputDir = "${buildDir}/dist"

    doFirst {
        delete "${outputDir}/leeks"
        file(outputDir).mkdirs()
    }

    commandLine jpackage,
            '--name', 'leeks',
            '--input', "${buildDir}/libs",
            '--main-jar', "leeks-desktop-${project.version}.jar",
            '--main-class', 'app.DesktopApp',
            '--type', 'app-image',
            '--dest', outputDir,
            '--runtime-image', System.getProperty('java.home')
}

task desktopZip(type: Zip, dependsOn: desktopExe) {
    archiveBaseName = 'leeks-desktop'
    archiveVersion = project.version
    from "${buildDir}/dist/leeks"
    into 'leeks'
}